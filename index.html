<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>香港之旅 - 智慧旅遊助手</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    :root { --color-blue:#4169E1 }
    .text-royal-blue { color:var(--color-blue) }
    .bg-royal-blue { background-color:var(--color-blue) }

    .no-scrollbar::-webkit-scrollbar { display:none }
    .no-scrollbar { scrollbar-width:none }

    .scale-in { animation:scaleIn .2s ease both }
    @keyframes scaleIn {
      from { opacity:0; transform:scale(.98) }
      to { opacity:1; transform:scale(1) }
    }

    .card {
      @apply bg-white border border-gray-100 rounded-[2rem] p-5 shadow-sm transition-all;
    }
  </style>
</head>

<body class="bg-gray-50">
<div id="app" class="max-w-md mx-auto min-h-screen bg-white shadow-xl pb-28">

<!-- ================= HEADER ================= -->
<header class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b p-4">
  <div class="flex justify-between items-end">
    <div>
      <h1 class="text-2xl font-black">{{ activeMenuName }}</h1>
      <p v-if="activeTab==='itinerary'" class="text-xs font-bold"
         :class="state.tripRange.start ? 'text-gray-400':'text-red-500'">
        <i class="far fa-calendar mr-1"></i>
        {{ state.tripRange.start
          ? `${state.tripRange.start} ~ ${state.tripRange.end}`
          : '尚未設定旅行日期' }}
      </p>
    </div>

    <button @click="toggleEdit"
      class="px-5 py-2 rounded-full text-xs font-bold transition"
      :class="isEditMode ? 'bg-red-500 text-white':'bg-gray-100 text-gray-600'">
      <i :class="isEditMode?'fas fa-check':'fas fa-edit'" class="mr-1"></i>
      {{ isEditMode?'完成編輯':'編輯模式' }}
    </button>
  </div>

  <!-- Day selector -->
  <div v-if="activeTab==='itinerary'" class="mt-4">
    <div v-if="state.tripDates.length"
      class="flex space-x-2 overflow-x-auto no-scrollbar pb-1">
      <button v-for="(d,i) in state.tripDates" :key="d.id"
        @click="activeDateId=d.id"
        class="px-4 py-2 rounded-2xl text-xs font-bold min-w-[72px]"
        :class="activeDateId===d.id
          ? 'bg-royal-blue text-white'
          : 'bg-gray-50 text-gray-400'">
        <div class="text-[9px] uppercase">Day {{ i+1 }}</div>
        {{ formatDate(d.fullDate) }}
      </button>

      <button v-if="isEditMode"
        @click="modals.range=true"
        class="w-12 h-12 border-2 border-dashed border-red-400 rounded-2xl text-red-500">
        <i class="fas fa-calendar-plus"></i>
      </button>
    </div>

    <div v-else
      @click="isEditMode && (modals.range=true)"
      class="h-14 border-2 border-dashed rounded-2xl flex items-center justify-center text-xs text-gray-400">
      {{ isEditMode?'＋ 點擊設定日期':'請先開啟編輯模式' }}
    </div>
  </div>
</header>

<!-- ================= MAIN ================= -->
<main class="p-4">

<!-- ===== ITINERARY ===== -->
<section v-if="activeTab==='itinerary'" class="scale-in">

  <button v-if="isEditMode && state.tripDates.length"
    @click="openAddItem"
    class="w-full mb-5 py-5 border-2 border-dashed rounded-[2rem] text-gray-400 font-bold">
    <i class="fas fa-plus-circle text-royal-blue mr-2"></i>
    新增行程（Day {{ currentDay }})
  </button>

  <div v-if="currentItinerary.length" class="space-y-4">
    <article v-for="item in currentItinerary" :key="item.id"
      @click="onItemClick(item)"
      class="card border-l-[8px] cursor-pointer"
      :class="categoryConfig[item.category]?.border">

      <div class="flex justify-between">
        <div>
          <p class="font-black text-sm">
            <i class="far fa-clock mr-1 text-royal-blue"></i>{{ item.time }}
          </p>
          <h3 class="text-lg font-bold">{{ item.name }}</h3>
        </div>

        <div class="flex flex-col items-end">
          <span class="px-3 py-1 text-[10px] rounded-xl text-white font-black"
            :class="categoryConfig[item.category]?.bg">
            {{ item.category }}
          </span>

          <button v-if="isEditMode"
            @click.stop="removeItem('itinerary',item.id)"
            class="text-red-400 text-xs mt-2">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      </div>
    </article>
  </div>

  <div v-else class="py-24 text-center text-gray-300 font-bold">
    今日尚無行程
  </div>
</section>

<!-- ===== SHOPPING ===== -->
<section v-if="activeTab==='shopping'" class="space-y-4 scale-in">

  <button v-if="isEditMode"
    @click="openList('shopping')"
    class="w-full py-4 border-2 border-dashed rounded-3xl text-pink-500 font-bold">
    <i class="fas fa-cart-plus mr-2"></i>新增購物項目
  </button>

  <div v-for="i in state.shoppingList" :key="i.id"
    @click="isEditMode?openList('shopping',i):(i.checked=!i.checked)"
    class="card flex justify-between"
    :class="i.checked?'opacity-50':''">

    <div>
      <h3 class="font-bold" :class="i.checked?'line-through':''">
        {{ i.name }}
      </h3>
      <p class="text-xs text-gray-400">{{ i.info||'未填寫' }}</p>
    </div>

    <div class="flex items-center space-x-3">
      <i :class="i.checked?'fas fa-check-circle text-emerald-500':'far fa-circle text-gray-300'"
         class="text-xl"></i>

      <button v-if="isEditMode"
        @click.stop="removeItem('shopping',i.id)"
        class="text-red-400">
        <i class="fas fa-trash"></i>
      </button>
    </div>
  </div>
</section>

<!-- ===== FOOD ===== -->
<section v-if="activeTab==='food'" class="space-y-4 scale-in">

  <button v-if="isEditMode"
    @click="openList('food')"
    class="w-full py-4 border-2 border-dashed rounded-3xl text-orange-500 font-bold">
    <i class="fas fa-utensils mr-2"></i>新增餐廳
  </button>

  <div v-for="i in state.foodList" :key="i.id"
    @click="isEditMode?openList('food',i):showDetail(i)"
    class="card border-l-[8px] border-orange-400 flex justify-between">

    <div>
      <h3 class="font-bold">{{ i.name }}</h3>
      <p class="text-[10px] font-black text-orange-500 uppercase">
        {{ i.info||'未填寫必點' }}
      </p>
    </div>

    <button v-if="isEditMode"
      @click.stop="removeItem('food',i.id)"
      class="text-red-400">
      <i class="fas fa-trash"></i>
    </button>
  </div>
</section>

</main>

<!-- ================= NAV ================= -->
<nav class="fixed bottom-0 inset-x-0 bg-white border-t flex justify-around py-4 max-w-md mx-auto">
  <button v-for="m in menus" :key="m.tab"
    @click="activeTab=m.tab"
    :class="activeTab===m.tab?'text-royal-blue':'text-gray-300'"
    class="flex flex-col items-center">
    <i :class="m.icon" class="text-xl"></i>
    <span class="text-[10px] font-black">{{ m.name }}</span>
  </button>
</nav>

</div>

<!-- ================= SCRIPT ================= -->
<script>
const { createApp, ref, reactive, computed, watch } = Vue;

const STORAGE_KEY = 'hk_app_v13';

const categoryConfig = {
  景點:{ bg:'bg-blue-600', border:'border-blue-600' },
  美食:{ bg:'bg-orange-500', border:'border-orange-500' },
  交通:{ bg:'bg-emerald-500', border:'border-emerald-500' },
  購物:{ bg:'bg-pink-500', border:'border-pink-500' },
  住宿:{ bg:'bg-indigo-500', border:'border-indigo-500' }
};

createApp({
  setup() {

    /* ---------- STATE ---------- */
    const state = reactive({
      tripRange:{ start:'', end:'' },
      tripDates:[],
      itineraryList:[],
      shoppingList:[],
      foodList:[]
    });

    Object.assign(state, JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}'));

    watch(state, () =>
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state)),
      { deep:true }
    );

    /* ---------- UI ---------- */
    const activeTab = ref('itinerary');
    const isEditMode = ref(false);
    const activeDateId = ref(state.tripDates[0]?.id || '');

    const menus = [
      { tab:'itinerary', name:'行程', icon:'fas fa-map-marked' },
      { tab:'shopping', name:'購物', icon:'fas fa-shopping-cart' },
      { tab:'food', name:'美食', icon:'fas fa-heart' }
    ];

    /* ---------- COMPUTED ---------- */
    const activeMenuName = computed(
      ()=>menus.find(m=>m.tab===activeTab.value).name
    );

    const currentDay = computed(
      ()=>state.tripDates.findIndex(d=>d.id===activeDateId.value)+1
    );

    const currentItinerary = computed(
      ()=>state.itineraryList
        .filter(i=>i.dateId===activeDateId.value)
        .sort((a,b)=>a.time.localeCompare(b.time))
    );

    /* ---------- METHODS ---------- */
    const toggleEdit = () => isEditMode.value = !isEditMode.value;

    const formatDate = d => d ? d.slice(5).replace('-','/') : '';

    const openAddItem = () => {
      state.itineraryList.push({
        id:Date.now(),
        name:'新行程',
        time:'09:00',
        category:'景點',
        dateId:activeDateId.value
      });
    };

    const onItemClick = item => {
      if (!isEditMode.value) alert(item.name);
    };

    const openList = (type,item=null) => {
      const target = type==='shopping' ? state.shoppingList : state.foodList;
      if (!item) {
        target.push({ id:Date.now(), name:'新項目', info:'', checked:false });
      }
    };

    const showDetail = i => alert(i.name);

    const removeItem = (type,id) => {
      if (!confirm('確定刪除？')) return;
      state[type+'List'] =
        state[type+'List'].filter(i=>i.id!==id);
    };

    return {
      state, menus, activeTab, isEditMode, activeMenuName,
      activeDateId, currentDay, currentItinerary,
      categoryConfig,
      toggleEdit, openAddItem, openList,
      removeItem, onItemClick, showDetail,
      formatDate
    };
  }
}).mount('#app');
</script>
</body>
</html>
